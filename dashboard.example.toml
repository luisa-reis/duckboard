# panel-ddp dashboard configuration. Copy to dashboard.toml (git-ignored)
# and fill in. Every table but `target` is optional.

# WLED host, "host" or "host:port". 4.3.2.1 is the WLED-AP address.
target = "4.3.2.1"
fps = 10
# Gap file for `preview`, relative to this file: a copy of the board's WLED
# gap file, so hidden pixels come out grey. Optional; without it the preview
# shows the whole panel. 2d-gaps.example.json hides just the four corners.
# gaps = "2d-gaps.json"

# Current conditions from Open-Meteo (no key needed). units: celsius or
# fahrenheit. Remove the table to drop the weather tile.
[weather]
latitude = 37.77
longitude = -122.42
units = "celsius"
refresh_minutes = 10

# Home Assistant, for the sensor and now_playing tiles and the media hub.
# The token is a long-lived access token from your profile page. Remove
# the table to run without it.
[home_assistant]
url = "http://homeassistant.local:8123"
token = "PASTE-TOKEN"
media_player = "media_player.living_room"
refresh_seconds = 10

# What the four tiles show and what goes in the hub.
# Tile kinds: clock, date, weather, sensor, now_playing, blank.
# Hub kinds: media, blank.
[tiles]
top_left = { kind = "clock" }
top_right = { kind = "date" }
bottom_left = { kind = "weather" }
bottom_right = { kind = "sensor", entity = "sensor.nozzle_temperature", label = "NOZZLE", decimals = 0 }
hub = { kind = "media" }
