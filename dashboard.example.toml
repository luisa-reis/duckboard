# panel-ddp dashboard configuration. Copy to dashboard.toml (git-ignored)
# and fill in. `target` and `[tiles]` are all a clock-and-weather panel needs;
# the other tables switch on the tiles that need an account.

# WLED host, "host" or "host:port". 4.3.2.1 is the WLED-AP address.
target = "4.3.2.1"
fps = 10
# Gamma applied to pictures. WLED gamma-corrects its own effects but not
# streamed frames, and the HUB75 driver is linear, so sRGB covers need 2.2
# to look right. 1.0 if the board's realtime gamma correction is on.
gamma = 2.2
# Temperatures, everywhere they appear: fahrenheit (the default) or celsius.
# A Home Assistant reading in the other unit is converted.
temperature = "fahrenheit"
# Gap file for `preview`, relative to this file: a copy of the board's WLED
# gap file, so hidden pixels come out grey. Optional; without it the preview
# shows the whole panel. 2d-gaps.example.json hides just the four corners.
# gaps = "2d-gaps.json"

# What the four tiles show and what goes in the hub.
# Tile kinds:
#   clock, date            no source needed; clock takes seconds = "dot"
#                          (a second hand, the default) or "ring" (fills up),
#                          and dot_size, the ring pixels the dot covers (2)
#   weather                needs [weather]
#   now_playing            needs [spotify] or [home_assistant].media_player
#   sensor, progress       need [home_assistant]; progress adds a bar, full at max (default 100)
#   blank
# Hub kinds: media (album art, needs the same as now_playing), blank.
#
# The album art shows in one place. By default it is the background: the
# cover across the whole panel behind the tiles at alpha (0..1) so they stay
# legible. Setting the hub to media moves it there instead, as a
# shape: disc (a record, the default), square (the whole cover) or faded (the
# whole cover with the corners outside the circle dimmed), with spin = true
# turning it while playing. background = { kind = "none" } shows none.
[tiles]
top_left = { kind = "clock" }
top_right = { kind = "date" }
bottom_left = { kind = "weather" }
bottom_right = { kind = "now_playing" }
hub = { kind = "blank" }
background = { kind = "media", alpha = 0.12 }
# hub = { kind = "media", spin = false, shape = "disc", paused_alpha = 0.4, corner_alpha = 0.3 }
# For a panel that shows only the cover: every tile and the hub blank, and
# background = { kind = "media", alpha = 1.0 }

# Colours by role, "#rrggbb" or "#rrggbbaa"; an alpha blends the colour over
# the background art. These are the defaults. A tile takes the same table as
# colors = { ... } to override them for itself, e.g.
#   top_left = { kind = "clock", colors = { track = "#ffffff40" } }
# [colors]
# text = "#ffffff"          # hours, the day, readings, the title
# label = "#6e6e6e"         # labels, units, the month, the artist
# track = "#2d2d2d"         # the unfilled seconds ring, an empty bar, "--"
# accent = "#ffaa00"        # the weekday, the seconds fill, a bar on its way
# secondary = "#50aaff"     # the minutes
# full = "#3cdc5a"          # a bar at its maximum
# sun = "#ffaa00"
# moon = "#dcdcb4"
# cloud = "#c8c8d2"
# storm_cloud = "#78788c"
# rain = "#3c8cff"
# snow = "#ffffff"
# fog = "#6e6e6e"

# Current conditions from Open-Meteo, no key needed. units overrides the
# top-level temperature for this tile alone.
[weather]
latitude = 37.77
longitude = -122.42
refresh_minutes = 10
# units = "celsius"

# Spotify, for now_playing and the media hub. client_id is the Client ID of
# an app created at developer.spotify.com/dashboard with the redirect URI
# http://127.0.0.1:8888/callback. Then log in once, which writes the token
# file (git-ignored) next to this config:
#   panel-ddp spotify-login
[spotify]
client_id = "PASTE-CLIENT-ID"
# token_file = "spotify-token.json"
# refresh_seconds = 5

# Decoded album art is kept on disk between runs, oldest out first past the
# cap. dir is relative to this file; max_megabytes = 0 disables the cache.
[art_cache]
dir = "art-cache"
max_megabytes = 4

# Home Assistant, for sensor and progress tiles, or as the media source when
# there is no [spotify]. The token is a long-lived access token from your
# profile's Security tab.
# [home_assistant]
# url = "http://homeassistant.local:8123"
# token = "PASTE-TOKEN"
# media_player = "media_player.living_room"
# refresh_seconds = 10
# Example tiles for it:
# bottom_right = { kind = "sensor", entity = "sensor.living_room_temperature", label = "ROOM" }
# bottom_right = { kind = "progress", entity = "sensor.x1c_print_progress", label = "PRINT" }

# Alerts: while the entity is in the state, the panel drops the tiles,
# pulses in the colour and shows the label (up to four characters). Needs
# [home_assistant]. Any number of these.
# [[alerts]]
# entity = "binary_sensor.bathroom_water_leak"
# state = "on"
# label = "LEAK"
# color = "#ff1e1e"
# pulse_seconds = 1.5
