# Secrets for the configuration file, by the names it refers to them with,
# e.g. `token: {secret: home_assistant_token}`. Copy to secrets.yaml, which
# is git-ignored, and keep it readable by its owner alone (chmod 600). An
# environment variable PANEL_DDP_SECRET_<NAME> overrides an entry.
home_assistant_token: "a long-lived access token from Home Assistant"
http_token: "a long random string, for sources.http.token"
