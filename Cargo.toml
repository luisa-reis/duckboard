[package]
name = "panel-ddp"
version = "0.2.0"
edition = "2021"
description = "Dashboard for a 64x64 WLED matrix: draws with embedded-graphics, streams over DDP"

[[bin]]
name = "panel-ddp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
embedded-graphics = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
serde_yaml_ng = "0.10.0"
indexmap = { version = "2.14.2", features = ["serde"] }

[profile.release]
opt-level = 2
