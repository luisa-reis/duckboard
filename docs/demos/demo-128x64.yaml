# yaml-language-server: $schema=../../duckboard.schema.json
#
# The demo for a 128×64 panel: three dashboards that use the whole width,
# built from text, line, area, bar and bullet charts and tables, on made-up
# data. It needs no accounts: every page brings its own series and rows.
#
#   target/release/duckboard run --config docs/demos/demo-128x64.yaml --target <board> --once

target: "4.3.2.1"

width: 128
height: 64

# The gap file of a 128×64 board, for previews; without it they show the
# whole panel (2d-gaps.json is for the 64×64 board). It stays at the top of
# the repository; paths are relative to this file.
gaps: ../../2d-gaps-128x64.json

layouts:
  # A reading and its day on the left, a table on the right.
  split:
    name: {x: 2, y: 2, width: 60, height: 6}
    value: {x: 2, y: 10, width: 60, height: 20}
    chart: {x: 2, y: 33, width: 60, height: 22}
    foot: {x: 2, y: 57, width: 60, height: 6}
    table: {x: 68, y: 1, width: 59, height: 62}
  # A table across the panel.
  sheet:
    table: {x: 2, y: 1, width: 124, height: 62}
  # A reading beside its chart, over a chart the width of the panel.
  wide:
    name: {x: 2, y: 2, width: 60, height: 6}
    value: {x: 2, y: 10, width: 60, height: 20}
    chart: {x: 66, y: 3, width: 60, height: 26}
    below-name: {x: 2, y: 34, width: 124, height: 6}
    below: {x: 2, y: 42, width: 124, height: 21}

tiles:
  # A reading with an area chart under it.
  solar-name: {kind: text, text: "SOLAR TODAY", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
  solar-value: {kind: text, text: "3.2kW", size: 10x20, align: left}
  solar-foot: {kind: text, text: "PEAK 3.6 KW", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
  solar-area: {kind: area_chart, entity: sensor.demo_solar, area: "#ffaa00a0", area_bottom: "#ffaa0000", dot: "#ffffff"}
  # A table of fixed rows: a name over its value, a chart beside them.
  energy-table:
    kind: table
    gap: 1
    rows:
      - height: 20
        tiles:
          - {x: 0, y: 1, width: 30, height: 6, tile: {kind: text, text: "HOUSE", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 0, y: 8, width: 30, height: 12, tile: {kind: text, text: "640W", size: 6x12, align: left}}
          - {x: 32, y: 1, width: 27, height: 18, tile: {kind: line_chart, entity: sensor.demo_house, line: "#50aaff", dot: "#ffffff"}}
      - height: 20
        tiles:
          - {x: 0, y: 1, width: 30, height: 6, tile: {kind: text, text: "WEEK", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 0, y: 8, width: 30, height: 12, tile: {kind: text, text: "96kWh", size: 6x12, align: left}}
          - {x: 32, y: 1, width: 27, height: 18, tile: {kind: bar_chart, entity: sensor.demo_energy, width: 3, gap: 1, last: "#ffffff"}}
      - height: 20
        tiles:
          - {x: 0, y: 1, width: 30, height: 6, tile: {kind: text, text: "BATTERY", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 0, y: 8, width: 30, height: 12, tile: {kind: text, text: "81%", size: 6x12, align: left}}
          - {x: 32, y: 7, width: 27, height: 7, tile: {kind: bullet_chart, entity: sensor.demo_battery, target: 90, ranges: [20, 60], bar: "#3cdc5a"}}
  # A table with a row for each row of its data: text, then a line chart,
  # a bar chart and a bullet chart from the row's columns.
  services-table:
    kind: table
    data: services
    gap: 1
    rows:
      - height: 7
        tiles:
          - {x: 0, width: 38, tile: {kind: text, text: "SERVICE", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 39, width: 16, tile: {kind: text, text: "MS", size: 4x6, align: right, colors: {text: "#6e6e6e"}}}
          - {x: 59, width: 28, tile: {kind: text, text: "LATENCY", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 91, width: 13, tile: {kind: text, text: "REQ", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 108, width: 16, tile: {kind: text, text: "LOAD", size: 4x6, align: right, colors: {text: "#6e6e6e"}}}
      - height: 10
        repeat: true
        tiles:
          - {x: 0, y: 1, width: 38, height: 8, tile: {kind: text, column: name, size: 5x8, align: left, overflow: truncate}}
          - {x: 39, y: 1, width: 16, height: 8, tile: {kind: text, column: ms, size: 5x8, align: right, overflow: truncate}}
          - {x: 59, y: 1, width: 28, height: 8, tile: {kind: line_chart, column: latency, line: "#50aaff"}}
          - {x: 91, y: 1, width: 13, height: 8, tile: {kind: bar_chart, column: requests, bar: "#3cdc5a", width: 1, gap: 1}}
          - {x: 108, y: 3, width: 16, height: 4, tile: {kind: bullet_chart, column: load, ranges: [50, 80], bar: "#ffffff"}}
  # A reading beside its day, over a month of bars the width of the panel.
  outside-name: {kind: text, text: "OUTSIDE", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
  outside-value: {kind: text, text: "21.4°", size: 10x20, align: left}
  outside-chart: {kind: line_chart, entity: sensor.demo_outside, line: "#50aaff", dot: "#ff4060"}
  rain-name: {kind: text, text: "RAIN, LAST 31 DAYS", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
  rain-bars: {kind: bar_chart, entity: sensor.demo_rain, hours: 720, bar: "#2c6cd0", last: "#50aaff", width: 3, gap: 1}

page_seconds: 6.0

pages:
  energy:
    layout: split
    tiles: {name: solar-name, value: solar-value, chart: solar-area, foot: solar-foot, table: energy-table}
    data:
      sensors: {sensor.demo_battery: {state: "81"}}
      series:
        sensor.demo_solar: [0.0, 0.0, 0.1, 0.1, 0.1, 0.2, 0.3, 0.6, 0.8, 0.9, 0.8, 0.8, 1.1, 1.6, 2.0, 2.1, 1.8, 1.6, 1.8, 2.5, 3.1, 3.2, 2.7, 2.2, 2.2, 2.8, 3.4, 3.6, 3.0, 2.3, 2.0, 2.3]
        sensor.demo_house: [420.0, 552.0, 595.0, 579.0, 604.0, 688.0, 736.0, 676.0, 563.0, 502.0, 501.0, 493.0, 521.0, 521.0, 585.0, 693.0, 738.0, 677.0, 970.0, 946.0, 957.0, 904.0, 440.0, 461.0, 558.0, 680.0, 719.0, 663.0, 610.0, 623.0, 641.0, 572.0]
        sensor.demo_energy: [11.4, 13.8, 14.5, 13.1, 10.5, 13.1, 15.4]
  services:
    layout: sheet
    tiles: {table: services-table}
    data:
      tables:
        services:
          - {name: reports, ms: 260, load: 87, latency: [300, 280, 240, 250, 290, 270, 255, 262, 248, 275, 268, 260], requests: [2, 3, 1, 4, 6, 3, 2, 5]}
          - {name: search, ms: 131, load: 64, latency: [90, 120, 150, 140, 125, 160, 138, 122, 118, 135, 142, 131], requests: [70, 64, 58, 61, 75, 82, 79, 68]}
          - {name: billing, ms: 77, load: 38, latency: [80, 70, 75, 79, 83, 72, 74, 81, 76, 73, 78, 77], requests: [5, 9, 7, 12, 8, 6, 10, 11]}
          - {name: api, ms: 42, load: 52, latency: [40, 44, 41, 47, 39, 42, 45, 43, 40, 46, 41, 42], requests: [30, 42, 55, 61, 48, 37, 52, 66]}
          - {name: auth, ms: 18, load: 12, latency: [20, 19, 17, 18, 21, 17, 18, 19, 16, 18, 17, 18], requests: [12, 15, 11, 18, 22, 19, 14, 16]}
  outside:
    layout: wide
    tiles: {name: outside-name, value: outside-value, chart: outside-chart, below-name: rain-name, below: rain-bars}
    data:
      series:
        sensor.demo_outside: [11.1, 11.1, 11.0, 10.8, 10.4, 10.3, 10.5, 11.4, 12.8, 14.5, 16.2, 17.5, 18.4, 19.0, 19.6, 20.4, 21.4, 22.5, 23.4, 23.7, 23.3, 22.4, 21.2, 20.1, 19.2, 18.6, 18.0, 17.3, 16.1, 14.7, 13.2, 12.0]
        sensor.demo_rain: [0.0, 2.5, 7.0, 1.0, 0.0, 4.5, 12.0, 3.0, 0.0, 0.0, 6.0, 9.0, 2.0, 0.0, 1.5, 0.0, 0.0, 8.5, 14.0, 5.0, 1.0, 0.0, 0.0, 3.5, 6.5, 2.0, 0.0, 0.5, 4.0, 11.0, 7.5]
