# yaml-language-server: $schema=../../panel-ddp.schema.json
#
# The fonts demo: every U8g2 font a text tile can name with `font`. A small
# one says its own name; a large one shows a reading under its name. A line
# too wide for the panel scrolls. `panel-ddp fonts` lists them with the
# height a line of each takes. It needs no accounts and no data.
#
#   target/release/panel-ddp run --config docs/demos/fonts.yaml --target <board> --once

target: "4.3.2.1"

# The gap file is at the top of the repository; paths are relative to this
# file.
gaps: ../../2d-gaps.json

# The regions: rows across the panel, each as tall as the font it holds.
layouts:
  tiny-1:
    row_1: {x: 1, y: 2, width: 62, height: 6}
    row_2: {x: 1, y: 8, width: 62, height: 5}
    row_3: {x: 1, y: 13, width: 62, height: 8}
    row_4: {x: 1, y: 21, width: 62, height: 7}
    row_5: {x: 1, y: 28, width: 62, height: 9}
    row_6: {x: 1, y: 37, width: 62, height: 8}
    row_7: {x: 1, y: 45, width: 62, height: 8}
    row_8: {x: 1, y: 53, width: 62, height: 8}
