  ncenB08: {kind: text, text: "ncenB08", font: ncenB08, align: left}
  ncenB10: {kind: text, text: "ncenB10", font: ncenB10, align: left}
  ncenB14-label: {kind: text, text: "ncenB14", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
