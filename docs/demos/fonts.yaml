  profont10: {kind: text, text: "profont10", font: profont10, align: left}
  profont12: {kind: text, text: "profont12", font: profont12, align: left}
  profont15: {kind: text, text: "profont15", font: profont15, align: left}
  profont17: {kind: text, text: "profont17", font: profont17, align: left}
  profont22-label: {kind: text, text: "profont22", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
  profont22: {kind: text, text: "21.4", font: profont22, align: left}
  profont29-label: {kind: text, text: "profont29", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
