  timB14-label: {kind: text, text: "timB14", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
  timB14: {kind: text, text: "21.4", font: timB14, align: left}
  # Tall and bold, for one large reading: Free Universal Bold and Logisoso.
  fub11: {kind: text, text: "fub11", font: fub11, align: left}
  fub14-label: {kind: text, text: "fub14", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
  fub14: {kind: text, text: "21.4", font: fub14, align: left}
