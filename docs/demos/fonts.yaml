  open_iconic_all_1x: {kind: text, text: "@ABCDEFG", font: open_iconic_all_1x, align: left}
  open_iconic_weather_2x-label: {kind: text, text: "open_iconic_weather_2x", size: 4x6, align: left, colors: {text: "#6e6e6e"}}
