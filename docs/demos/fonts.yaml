page_seconds: 4.0

pages:
  tiny-1:
    layout: tiny-1
    tiles: {row_1: tom_thumb_4x6, row_2: micro, row_3: pixelle_micro, row_4: tinytim, row_5: haxrcorp4089, row_6: squeezed_r7, row_7: squeezed_b7, row_8: nokiafc22}
  pixel-1:
    layout: pixel-1
    tiles: {row_1: mozart_nbp, row_2: glasstown_nbp, row_3: smart_patrol_nbp, row_4: bitcasual, row_5: tenthinguys, row_6: tenfatguys}
  pixel-2:
    layout: pixel-2
    tiles: {row_1: fewture, row_2: halftone, row_3: Born2bSportyV2, row_4: DigitalDiscoThin}
  pixel-3:
    layout: pixel-3
    tiles: {row_1: Pixellari, row_2: VCR_OSD-label, row_3: VCR_OSD}
  mono-1:
    layout: mono-1
    tiles: {row_1: t0_11, row_2: t0_11b, row_3: t0_14b, row_4: profont10, row_5: profont12, row_6: profont15}
  mono-2:
    layout: mono-2
    tiles: {row_1: profont17, row_2: profont22-label, row_3: profont22}
  mono-3:
    layout: mono-3
    tiles: {row_1: profont29-label, row_2: profont29}
  sans-1:
    layout: sans-1
    tiles: {row_1: helvR08, row_2: helvB08, row_3: helvR10, row_4: helvB10}
  sans-2:
    layout: sans-2
    tiles: {row_1: helvR12-label, row_2: helvR12, row_3: helvB12-label, row_4: helvB12}
  sans-3:
