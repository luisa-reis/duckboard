    row_6: {x: 1, y: 42, width: 62, height: 18}

tiles:
  # The smallest: five to nine pixels a line.
  tom_thumb_4x6: {kind: text, text: "tom_thumb_4x6", font: tom_thumb_4x6, align: left}
  micro: {kind: text, text: "micro", font: micro, align: left}
