    tiles: {row_1: helvB14-label, row_2: helvB14, row_3: helvB18-label, row_4: helvB18}
  sans-4:
    layout: sans-4
    tiles: {row_1: helvB24-label, row_2: helvB24}
  serif-1:
    layout: serif-1
    tiles: {row_1: ncenR08, row_2: ncenB08, row_3: ncenB10, row_4: ncenB14-label, row_5: ncenB14}
  serif-2:
    layout: serif-2
    tiles: {row_1: timR08, row_2: timB10, row_3: timB14-label, row_4: timB14}
  display-1:
    layout: display-1
    tiles: {row_1: fub11, row_2: fub14-label, row_3: fub14}
  display-2:
    layout: display-2
    tiles: {row_1: fub17-label, row_2: fub17, row_3: fub20-label, row_4: fub20}
  display-3:
    layout: display-3
    tiles: {row_1: logisoso16-label, row_2: logisoso16, row_3: logisoso20-label, row_4: logisoso20}
  display-4:
    layout: display-4
    tiles: {row_1: logisoso24-label, row_2: logisoso24}
  display-5:
    layout: display-5
    tiles: {row_1: logisoso28-label, row_2: logisoso28}
  icons-1:
    layout: icons-1
    tiles: {row_1: open_iconic_weather_1x-label, row_2: open_iconic_weather_1x, row_3: open_iconic_all_1x-label, row_4: open_iconic_all_1x, row_5: open_iconic_weather_2x-label, row_6: open_iconic_weather_2x}
