# yaml-language-server: $schema=../../panel-ddp.schema.json
#
# The table demo: rows of text and charts, one table with a row for each
# row of data and one with fixed rows. It needs no accounts: every page
# brings its own data.
#
#   target/release/panel-ddp run --config docs/demos/tables.yaml --target <board> --once

target: "4.3.2.1"

# The gap file is at the top of the repository; paths are relative to this
# file.
gaps: ../../2d-gaps.json

layouts:
  # A table across the panel.
  sheet:
    table: {x: 1, y: 1, width: 62, height: 62}

tiles:
  house-chart: {kind: line_chart, entity: sensor.demo_house, line: "#50aaff"}
  # Area charts: the same line over a filled area, in the line's colour
  # faded unless it has its own, and a gradient down to `area_bottom`.
  solar-area: {kind: area_chart, entity: sensor.demo_solar, area: "#ffaa00a0", area_bottom: "#ffaa0000", dot: "#ffffff"}
  energy-bars: {kind: bar_chart, entity: sensor.demo_energy, width: 1, last: "#ffffff"}
  # Tables: rows of a height, each with tiles placed from the row's corner.
  # Names set left and cut short, numbers set right, a chart on the end;
  # the table's own colours reach every tile on it. This one's rows are
  # data: what a query's results would be, pushed to /tables/rooms, and
  # here the page's own.
  rooms-table:
    kind: table
    data: rooms
    gap: 1
    colors: {accent: "#50aaff"}
    rows:
      - height: 7
        tiles:
          - {x: 0, width: 27, tile: {kind: text, text: "ROOM", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 29, width: 19, tile: {kind: text, text: "°C", size: 4x6, align: right, colors: {text: "#6e6e6e"}}}
          - {x: 50, width: 12, tile: {kind: text, text: "24H", size: 4x6, align: right, colors: {text: "#6e6e6e"}}}
      # Once for each row of the data, from its columns.
      - height: 10
        repeat: true
        tiles:
          - {x: 0, width: 27, tile: {kind: text, column: room, size: 4x6, align: left, overflow: truncate}}
          - {x: 29, width: 19, tile: {kind: text, column: temp, size: 5x8, align: right}}
          - {x: 50, y: 1, width: 12, height: 8, tile: {kind: line_chart, column: history}}
  # Taller rows, with a name over its value on the left of each.
  energy-table:
    kind: table
    gap: 1
    rows:
      - height: 20
        tiles:
          - {x: 0, y: 1, width: 30, height: 6, tile: {kind: text, text: "SOLAR", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 0, y: 8, width: 30, height: 12, tile: {kind: text, text: "3.2kW", size: 6x12, align: left}}
          - {x: 32, y: 1, width: 30, height: 18, tile: solar-area}
      - height: 20
        tiles:
          - {x: 0, y: 1, width: 30, height: 6, tile: {kind: text, text: "HOUSE", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 0, y: 8, width: 30, height: 12, tile: {kind: text, text: "640W", size: 6x12, align: left}}
          - {x: 32, y: 1, width: 30, height: 18, tile: house-chart}
      - height: 20
        tiles:
          - {x: 0, y: 1, width: 30, height: 6, tile: {kind: text, text: "WEEK", size: 4x6, align: left, colors: {text: "#6e6e6e"}}}
          - {x: 0, y: 8, width: 30, height: 12, tile: {kind: text, text: "96kWh", size: 6x12, align: left}}
          - {x: 32, y: 1, width: 30, height: 18, tile: energy-bars}

page_seconds: 5.0

pages:
  # Tables: five rooms from data under a header, then three taller rows.
  rooms:
    layout: sheet
    tiles: {table: rooms-table}
    data:
      tables:
        rooms:
          - {room: LIVING, temp: 21.4, history: [20.0, 20.4, 20.9, 21.2, 21.5, 21.7, 21.8, 21.8, 21.7, 21.5, 21.3, 21.0, 20.6, 20.3, 20.0, 19.7, 19.5, 19.4, 19.4, 19.5, 19.7, 20.0, 20.4, 20.8]}
          - {room: KITCHEN, temp: 22.8, history: [21.0, 21.4, 21.5, 21.3, 20.8, 20.5, 20.6, 20.9, 21.3, 21.5, 21.3, 20.9, 20.6, 20.6, 21.1, 22.2, 23.3, 23.9, 23.3, 22.0, 21.1, 20.9, 21.2, 21.5]}
          - {room: BEDROOM, temp: 18.9, history: [20.0, 20.2, 20.3, 20.4, 20.3, 20.2, 20.0, 19.8, 19.5, 19.2, 18.9, 18.7, 18.6, 18.6, 18.7, 18.8, 18.9, 19.1, 19.2, 19.3, 19.3, 19.2, 19.0, 18.7]}
          - {room: OFFICE, temp: 23.1, history: [19.0, 19.3, 19.3, 19.1, 18.9, 19.1, 19.6, 20.1, 20.5, 20.8, 21.2, 21.8, 22.5, 22.9, 22.9, 22.7, 22.6, 22.9, 23.2, 23.3, 23.1, 22.8, 22.7, 23.0]}
          - {room: CONSERVATORY, temp: 27.5, history: [15.0, 15.1, 15.3, 15.8, 16.3, 17.0, 17.8, 18.7, 19.7, 20.7, 21.7, 22.7, 23.7, 24.5, 25.3, 25.9, 26.4, 26.8, 27.0, 27.0, 26.8, 26.5, 26.0, 25.4]}
  energy-table:
    layout: sheet
    tiles: {table: energy-table}
    data:
      series:
        sensor.demo_solar: [0.0, 0.0, 0.1, 0.1, 0.1, 0.2, 0.3, 0.6, 0.8, 0.9, 0.8, 0.8, 1.1, 1.6, 2.0, 2.1, 1.8, 1.6, 1.8, 2.5, 3.1, 3.2, 2.7, 2.2, 2.2, 2.8, 3.4, 3.6, 3.0, 2.3, 2.0, 2.3]
        sensor.demo_house: [420.0, 552.0, 595.0, 579.0, 604.0, 688.0, 736.0, 676.0, 563.0, 502.0, 501.0, 493.0, 521.0, 521.0, 585.0, 693.0, 738.0, 677.0, 970.0, 946.0, 957.0, 904.0, 440.0, 461.0, 558.0, 680.0, 719.0, 663.0, 610.0, 623.0, 641.0, 572.0]
        sensor.demo_energy: [11.4, 13.8, 14.5, 13.1, 10.5, 13.1, 15.4, 15.8, 14.3, 11.6, 14.9, 16.9, 17.1, 15.4, 13.4]
